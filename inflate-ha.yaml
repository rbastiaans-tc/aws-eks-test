apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate-ha
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inflate-ha
  template:
    metadata:
      labels:
        app: inflate-ha
    spec:
      terminationGracePeriodSeconds: 0
      nodeSelector:
        eks.amazonaws.com/compute-type: auto
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: inflate-ha
      containers:
        - name: inflate
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.10
          resources:
            requests:
              cpu: 1
          securityContext:
            allowPrivilegeEscalation: false
